; On/off switches. true or false.

[features]
; SMS through MSG91 (needs MSG91_AUTH_KEY + MSG91_ORDER_FLOW_ID in .env and a DLT template).
sms = false
; "Book a showroom visit" form and Admin → Visits.
visit_booking = true
; "Ask on WhatsApp" button on product pages (needs a WhatsApp number in Admin → Showroom, or [support] whatsapp_number).
whatsapp_button = true
; Today's gold rate above the header (needs rates in Admin → Gold rates).
rate_strip = true
; /style-advisor quiz.
style_advisor = true

[logging]
; debug | info | warn | error. Use debug only while investigating a problem.
level = info
