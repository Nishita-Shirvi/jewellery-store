; Where uploaded product images are stored. Keys/secrets go in .env, never here.

[images]
; cloudinary – needs CLOUDINARY_CLOUD_NAME / _API_KEY / _API_SECRET in .env
; r2         – Cloudflare R2; needs R2_ACCOUNT_ID / R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY /
;              R2_BUCKET in .env and r2_public_url below
; none       – no uploads; admins choose from the built-in placeholder images
provider = cloudinary
; Largest image an admin can upload, in MB.
max_upload_mb = 5
; Public address of the R2 bucket (custom domain or the bucket's r2.dev URL), https only.
r2_public_url =
