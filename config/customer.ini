; Customer care and privacy: support emails, WhatsApp, how long old data is kept.
; Full guide: Docs/CONFIGURATION.md

[support]
; Where new support tickets and customer replies are emailed. Empty = [business] email.
notify_email =
; WhatsApp business number with country code (e.g. 919876543210) for a "Chat on WhatsApp"
; button on the help centre and ticket pages. Empty = no button.
whatsapp_number =

[privacy]
; How many days data that's no longer needed is kept; a daily clean-up deletes it after that.
; Orders and invoices are never deleted (tax law). Shown in the privacy policy.
otp_days = 2
password_reset_days = 7
cart_reminder_days = 180
stock_alert_days = 365
unconfirmed_subscriber_days = 30
webhook_event_days = 90
audit_log_days = 730
