<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#4a1528" />
    <title>You're offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #fbf7f4;
        color: #2a1a1f;
        font-family: Georgia, "Times New Roman", serif;
        text-align: center;
        padding: 24px;
      }
      img {
        width: 72px;
        height: 72px;
        border-radius: 16px;
      }
      h1 {
        font-weight: normal;
        margin: 20px 0 8px;
      }
      p {
        font-family: system-ui, sans-serif;
        color: #6b5a60;
        max-width: 26rem;
        line-height: 1.5;
      }
      button {
        margin-top: 16px;
        font: inherit;
        font-family: system-ui, sans-serif;
        background: #4a1528;
        color: #fbf7f4;
        border: 0;
        border-radius: 8px;
        padding: 10px 18px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>
        Check your internet connection and try again. Your cart is saved and will be waiting for
        you.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
