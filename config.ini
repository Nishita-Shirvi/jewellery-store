; ─────────────────────────────────────────────────────────────
; Jewellery Store — application settings (NOT secrets)
;
; - Business rules and store details live here, are committed to git, and change by deploy.
; - Secrets (API keys, passwords, DB URLs) NEVER go here — they stay in .env / Vercel env vars.
; - Any value can be overridden per environment with an env var named SECTION_KEY in
;   upper case, e.g. [shipping] fee_rupees  →  SHIPPING_FEE_RUPEES=0
; - Loaded and validated by lib/config.ts. A wrong value stops `npm run dev` / `npm run build`
;   with a clear message, so a typo can never reach customers.
; - Full guide: Docs/CONFIGURATION.md
; ─────────────────────────────────────────────────────────────

[business]
; Shown on legal pages, invoices and the footer. Replace every [placeholder] before going live.
legal_name = [Your registered business name]
address = [Registered address, City, State, PIN]
email = support@example.com
phone = [+91 phone number]
gstin = [GSTIN]
; Seller's state for GST: same state as the buyer → CGST + SGST, otherwise IGST.
; Must match the official name exactly, e.g. Telangana, Maharashtra, Tamil Nadu
state = Telangana

[grievance_officer]
; Required by the Consumer Protection (E-Commerce) Rules; shown on legal pages.
name = [Grievance officer name]
email = grievance@example.com

[invoice]
; Invoice numbers look like INV/2026-27/000001. Capital letters, digits and "-" only, max 10.
prefix = INV

[shipping]
; Flat fee in rupees, free when the order total (after discount) is at or above the threshold.
fee_rupees = 99
free_above_rupees = 999

[inventory]
; How long stock is held for a customer who is paying (minutes).
reservation_minutes = 15
; Products with this many or fewer pieces available show as "low stock" in admin
; and are included in the daily low-stock email.
low_stock_threshold = 3

[alerts]
; Where alerts are emailed (low stock and the alerts below). Empty = every admin account.
admin_email =
; Business alerts (Phase 26). Each emails once when it starts, reminds every repeat_hours while
; it lasts, and emails again when it's resolved. What to do: Docs/RUNBOOK.md. 0 = off.
; No paid/COD order for this many hours.
no_orders_hours = 48
; Payment failures: at least this many failed payments or gateway errors…
payment_failures_min = 5
; …making up at least this % of payment attempts…
payment_failure_rate_percent = 50
; …within this many minutes.
payment_window_minutes = 15
; Error log lines in 10 minutes.
error_spike_count = 25
; Webhooks with a wrong signature in an hour (someone probing, or a changed secret).
bad_webhook_signatures_per_hour = 10
; How many best-sellers (last 30 days) to watch for running out of stock.
stockout_top_sellers = 10
repeat_hours = 6

[features]
; SMS through MSG91 (needs MSG91_AUTH_KEY + MSG91_ORDER_FLOW_ID in .env and a DLT template).
sms = false

[cod]
; Cash on delivery (Phase 18). Online payment is always available.
enabled = true
; Largest order total (rupees, after discount, incl. shipping and COD fee) allowed on COD.
; Kept low on purpose: jewellery COD has high fraud and refusal (RTO) risk.
max_order_rupees = 10000
; Extra fee for COD orders, in rupees (0 = free).
fee_rupees = 0
; Only these pincodes / pincode prefixes, comma-separated (e.g. 500, 560001). Empty = everywhere.
pincodes =
; Customers who refused this many COD parcels can't choose COD any more.
max_refusals = 2
; Confirm every COD order with an SMS one-time code (needs MSG91_AUTH_KEY + MSG91_OTP_TEMPLATE_ID).
; When SMS isn't set up, COD is hidden in production and the code is written to the server log in development.
otp_required = true

[marketing]
; Cart reminder emails to signed-in customers who left items in their cart (Phase 20).
; Never sent to anyone who unsubscribed, or who ordered since.
abandoned_cart = true
abandoned_first_minutes = 60
abandoned_second_hours = 24
; Percent off in the second reminder, as a single-use coupon for that customer (0 = no coupon).
abandoned_coupon_percent = 0
; Referral reward: a coupon worth this many rupees for the referrer, after the friend's first
; delivered order (0 = referrals off). The coupon needs an order of at least referral_min_order_rupees.
referral_reward_rupees = 500
referral_min_order_rupees = 2000

[support]
; Where new support tickets and customer replies are emailed. Empty = [business] email.
notify_email =
; WhatsApp business number with country code (e.g. 919876543210) for a "Chat on WhatsApp"
; button on the help centre and ticket pages. Empty = no button.
whatsapp_number =

[festivals]
; Festival dates offered as one-click date pickers when scheduling sale banners and
; collections (Admin → Content). Format: YYYY-MM-DD..YYYY-MM-DD (India time, both days
; included). These follow the lunar calendar — CHECK AND UPDATE THEM EVERY YEAR.
; Empty = that festival isn't offered.
akshaya_tritiya =
dhanteras = 2026-11-06..2026-11-06
diwali = 2026-11-08..2026-11-08
wedding_season = 2026-11-20..2027-02-28

[logging]
; debug | info | warn | error. Use debug only while investigating a problem.
level = info
