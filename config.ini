; ─────────────────────────────────────────────────────────────
; Jewellery Store — application settings (NOT secrets)
;
; - Business rules and store details live here, are committed to git, and change by deploy.
; - Secrets (API keys, passwords, DB URLs) NEVER go here — they stay in .env / Vercel env vars.
; - Any value can be overridden per environment with an env var named SECTION_KEY in
;   upper case, e.g. [shipping] fee_rupees  →  SHIPPING_FEE_RUPEES=0
; - Loaded and validated by lib/config.ts. A wrong value stops `npm run dev` / `npm run build`
;   with a clear message, so a typo can never reach customers.
; - Full guide: Docs/CONFIGURATION.md
; ─────────────────────────────────────────────────────────────

[business]
; Shown on legal pages, invoices and the footer. Replace every [placeholder] before going live.
legal_name = [Your registered business name]
address = [Registered address, City, State, PIN]
email = support@example.com
phone = [+91 phone number]
gstin = [GSTIN]
; Seller's state for GST: same state as the buyer → CGST + SGST, otherwise IGST.
; Must match the official name exactly, e.g. Telangana, Maharashtra, Tamil Nadu
state = Telangana

[grievance_officer]
; Required by the Consumer Protection (E-Commerce) Rules; shown on legal pages.
name = [Grievance officer name]
email = grievance@example.com

[invoice]
; Invoice numbers look like INV/2026-27/000001. Capital letters, digits and "-" only, max 10.
prefix = INV

[shipping]
; Flat fee in rupees, free when the order total (after discount) is at or above the threshold.
fee_rupees = 99
free_above_rupees = 999

[inventory]
; How long stock is held for a customer who is paying (minutes).
reservation_minutes = 15
; Products with this many or fewer pieces available show as "low stock" in admin
; and are included in the daily low-stock email.
low_stock_threshold = 3

[alerts]
; Where low-stock alerts are emailed. Empty = every admin account.
admin_email =

[features]
; SMS through MSG91 (needs MSG91_AUTH_KEY + MSG91_ORDER_FLOW_ID in .env and a DLT template).
sms = false

[cod]
; Cash on delivery (Phase 18). Online payment is always available.
enabled = true
; Largest order total (rupees, after discount, incl. shipping and COD fee) allowed on COD.
; Kept low on purpose: jewellery COD has high fraud and refusal (RTO) risk.
max_order_rupees = 10000
; Extra fee for COD orders, in rupees (0 = free).
fee_rupees = 0
; Only these pincodes / pincode prefixes, comma-separated (e.g. 500, 560001). Empty = everywhere.
pincodes =
; Customers who refused this many COD parcels can't choose COD any more.
max_refusals = 2
; Confirm every COD order with an SMS one-time code (needs MSG91_AUTH_KEY + MSG91_OTP_TEMPLATE_ID).
; When SMS isn't set up, COD is hidden in production and the code is written to the server log in development.
otp_required = true

[logging]
; debug | info | warn | error. Use debug only while investigating a problem.
level = info
